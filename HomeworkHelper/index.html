    <script>
        const STORAGE_KEY = 'homework-helper-spelling-words';
        const FILTER_STORAGE_KEY = 'homework-helper-filter-real-words';
        const PIN_STORAGE_KEY = 'homework-helper-guardian-pin-hash';
        const LIST_STORAGE_KEY = 'homework-helper-spelling-list';
        const MODE_STORAGE_KEY = 'homework-helper-quiz-modes';
        const CUSTOM_LIST_ID = 'custom';

        // Quiz style per list: 'choice' (multiple choice, default) or
        // 'typed' (hear the word, type it). Keyed by list id.
        let quizModes = {};
        try {
            quizModes = JSON.parse(localStorage.getItem(MODE_STORAGE_KEY)) || {};
        } catch (e) {
            quizModes = {};
        }

        function currentMode() {
            return quizModes[state.listId] === 'typed' ? 'typed' : 'choice';
        }

        function saveModes() {
            localStorage.setItem(MODE_STORAGE_KEY, JSON.stringify(quizModes));
        }

        // Typed answers: ignore case/extra spaces, and treat iOS "smart"
        // apostrophes like plain ones.
        function normalizeAnswer(s) {
            return (s || '').trim().toLowerCase().replace(/[‘’]/g, "'");
        }

        function isAnswered(q) {
            return currentMode() === 'typed'
                ? normalizeAnswer(q.typed) !== ''
                : q.selected !== null;
        }

        function isCorrect(q) {
            return currentMode() === 'typed'
                ? normalizeAnswer(q.typed) === q.word
                : q.selected !== null && q.choices[q.selected] === q.word;
        }
        // Static salt so a common PIN like "1234" doesn't hash to a value
        // findable in a public rainbow table. Easy to bypass for a skilled
        // user; that's fine — the goal is just to slow down a curious kid.
        const PIN_SALT = 'hh-guardian::';

        const state = {
            words: [],     // the user's own list ("My Words")
            listId: CUSTOM_LIST_ID, // which list the quiz is using
            test: [],      // [{ word, choices: [str], selected: null|idx, challenge: bool }]
            graded: false,
            filterRealWords: true, // when false, real English words may be used as distractors
        };

        // In-progress tests for lists you've switched away from, so flipping
        // between weeks doesn't throw away answers. Memory only.
        const sessions = new Map();

        // ---------- Weekly lists (from spelling-lists.js) ----------
        function parseLocalDate(iso) {
            const [y, m, d] = iso.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        function todayLocal() {
            const now = new Date();
            return new Date(now.getFullYear(), now.getMonth(), now.getDate());
        }

        // Expand 'wolf/wolves' entries into separate words and remember which
        // singular each plural came from (used for "wolfs"-style traps).
        const PLURAL_TO_SINGULAR = new Map();

        const SPELLING_LISTS = (window.HOMEWORK_HELPER_SPELLING_LISTS || [])
            .map(list => {
                const words = [];
                const push = w => {
                    const lower = w.trim().toLowerCase();
                    if (lower && !words.includes(lower)) words.push(lower);
                };
                for (const entry of list.words || []) {
                    const parts = entry.split('/').map(p => p.trim().toLowerCase()).filter(Boolean);
                    if (parts.length === 2 && parts[0] !== parts[1]) {
                        PLURAL_TO_SINGULAR.set(parts[1], parts[0]);
                    }
                    parts.forEach(push);
                }
                const challenge = (list.challenge || []).map(w => w.trim().toLowerCase());
                challenge.forEach(push);
                return {
                    ...list,
                    date: parseLocalDate(list.testDate),
                    allWords: words,
                    challengeSet: new Set(challenge),
                };
            })
            .sort((a, b) => a.date - b.date);

        function getList(id) {
            return SPELLING_LISTS.find(l => l.id === id) || null;
        }

        // The next list whose test is today or later.
        function getUpcomingList() {
            const today = todayLocal();
            return SPELLING_LISTS.find(l => l.date >= today) || null;
        }

        function activeWords() {
            const list = getList(state.listId);
            return list ? list.allWords : state.words;
        }

        function activeChallengeSet() {
            const list = getList(state.listId);
            return list ? list.challengeSet : new Set();
        }

        // ---------- Storage ----------
        function loadWords() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                state.words = raw ? JSON.parse(raw) : [];
            } catch (e) {
                state.words = [];
            }
            // Default to true if never set.
            const filter = localStorage.getItem(FILTER_STORAGE_KEY);
            state.filterRealWords = filter === null ? true : filter === 'true';

            // Reopen the last list, unless it was a week whose test has
            // passed; then jump to the upcoming week so a new week "just
            // shows up" without anyone clicking.
            const saved = localStorage.getItem(LIST_STORAGE_KEY);
            const savedList = getList(saved);
            const upcoming = getUpcomingList();
            if (saved === CUSTOM_LIST_ID) {
                state.listId = CUSTOM_LIST_ID;
            } else if (savedList && savedList.date >= todayLocal()) {
                state.listId = savedList.id;
            } else if (upcoming) {
                state.listId = upcoming.id;
            } else if (state.words.length === 0 && SPELLING_LISTS.length) {
                state.listId = SPELLING_LISTS[SPELLING_LISTS.length - 1].id;
            } else {
                state.listId = CUSTOM_LIST_ID;
            }
        }

        function saveWords() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state.words));
        }

        function saveListPref() {
            localStorage.setItem(LIST_STORAGE_KEY, state.listId);
        }

        function saveFilterPref() {
            localStorage.setItem(FILTER_STORAGE_KEY, String(state.filterRealWords));
        }

        // ---------- Misspelling generation ----------
        // Goal: generate misspellings a real student would plausibly make.
        // Strategy: score each candidate by how "human" the error is, then pull
        // from the top slice (with randomness) so the same word can produce
        // different distractors across resets.
        //
        // Score tiers (rough):
        //   10: morphological suffix traps (-ance/-ence, -able/-ible, tion/sion)
        //    9: classic phonetic traps (ie/ei, ph/f, silent-e drop, soft-c/s)
        //    8: schwa-vowel confusion (a/e swap mid-word, drop unstressed vowel)
        //    7: doubled-consonant errors (add or drop one half of a double)
        //    6: other vowel swaps (i/e, o/u)
        //    5: hard-c/k, y/i at end
        //    3: keyboard-adjacent typo (fallback, capped at one per word)

        const VOWELS = 'aeiouy';
        const HARD_VOWELS = 'aeiou';

        // QWERTY adjacency for the last-resort typo fallback.
        const KEY_ADJ = {
            a:'qwsz', b:'vghn', c:'xdfv', d:'serfcx', e:'wsdr', f:'drtgvc',
            g:'ftyhbv', h:'gyujnb', i:'ujko', j:'huikmn', k:'jiolm', l:'kop',
            m:'njk', n:'bhjm', o:'iklp', p:'ol', q:'wa', r:'edft', s:'awedxz',
            t:'rfgy', u:'yhji', v:'cfgb', w:'qase', x:'zsdc', y:'tghu', z:'asx'
        };

        function replaceChar(w, i, sub) { return w.slice(0, i) + sub + w.slice(i + 1); }
        function replaceRange(w, i, len, sub) { return w.slice(0, i) + sub + w.slice(i + len); }
        function dropChar(w, i) { return w.slice(0, i) + w.slice(i + 1); }
        function doubleChar(w, i) { return w.slice(0, i + 1) + w[i] + w.slice(i + 1); }
        function transposeAdjacent(w, i) { return w.slice(0, i) + w[i + 1] + w[i] + w.slice(i + 2); }

        function isConsonant(c) { return c && !VOWELS.includes(c); }
        function isVowel(c) { return c && HARD_VOWELS.includes(c); }

        // Suffix pairs that students routinely confuse. Applied only when the
        // word actually ends in one member (keeps the misspelling one edit away).
        const SUFFIX_SWAPS = [
            ['ance', 'ence'], ['ence', 'ance'],
            ['ancy', 'ency'], ['ency', 'ancy'],
            ['ant',  'ent'],  ['ent',  'ant'],
            ['able', 'ible'], ['ible', 'able'],
            ['tion', 'sion'], ['sion', 'tion'],
            ['cious','tious'],['tious','cious'],
            ['ary',  'ery'],  ['ery',  'ary'],
            ['or',   'er'],   ['er',   'or'],
            // Forgetting the y -> i change: puppies->puppys, dried->dryed.
            ['ies',  'ys'],   ['ied',  'yed'],
        ];

        // Kid-style plural mistakes, when we know the singular (from a
        // 'wolf/wolves' pair): just add -s (wolfs, babys, mouses, childs),
        // or pluralize the plural (feets, teeths, childrens).
        function pluralTraps(word) {
            const singular = PLURAL_TO_SINGULAR.get(word);
            if (!singular) return [];
            const traps = [];
            if (!singular.endsWith('s')) traps.push(singular + 's');
            if (!word.endsWith('s')) traps.push(word + 's');
            return traps;
        }

        // Digraph / phonetic substitutions — how kids actually misspell when
        // writing by ear. Each is [pattern, replacement, score] and is applied
        // to every occurrence in the word.
        // Higher score = more iconic ("everyone does this") kid mistake.
        const PHONETIC_SWAPS = [
            // Iconic phonetic simplifications — kid spells what they hear:
            ['oo',  'u',    8],   // food->fud, good->gud, spoon->spun
            ['ou',  'u',    8],   // rough->ruf, enough->enuf, tough->tuf
            ['igh', 'i',    8],   // night->nit, right->rit, fight->fit
            ['wr',  'r',    8],   // wrong->rong, wrestle->restle
            ['kn',  'n',    8],   // knight->night, knee->nee
            ['dge', 'j',    8],   // judge->juj, bridge->brij
            ['tch', 'ch',   8],   // watch->wach, catch->cach
            // Vowel digraph confusion:
            ['ee',  'e',    7],   // feet->fet, sleep->slep
            ['ea',  'e',    7],   // beach->bech, reach->rech
            ['ea',  'ee',   7],   // beat->beet (filtered if word), peach->peech
            ['ai',  'a',    7],   // train->tran, rain->ran
            ['ai',  'ay',   7],   // rain->rayn, pain->payn
            ['ay',  'a',    7],   // play->pla, day->da
            ['ay',  'ai',   7],   // day->dai, way->wai
            ['oa',  'o',    7],   // boat->bot, coat->cot
            ['oa',  'ow',   7],   // boat->bowt, road->rowd
            ['ow',  'ou',   7],   // cow->cou, town->toun
            ['ou',  'ow',   7],   // house->howse, mouse->mowse
            // R-controlled vowels (notorious for kids, all sound like /ər/):
            ['er',  'ur',   7],   // her->hur, father->fathur
            ['ur',  'er',   7],   // turn->tern, burn->bern
            ['ir',  'ur',   7],   // bird->burd, first->furst
            ['ir',  'er',   7],   // girl->gerl, third->therd
            // Consonant simplifications:
            ['ck',  'k',    7],   // back->bak, duck->duk, chicken->chiken
            ['ing', 'in',   7],   // running->runnin, walking->walkin
            // Lower-score / less reliable variants (still plausible):
            ['u',   'oo',   6],   // put->poot, push->poosh
            ['ee',  'ea',   6],   // need->nead, seem->seam (often a word)
        ];

        // Homophone groups — words that sound alike but are spelled differently.
        // When the target word is in one of these groups, the siblings become
        // candidate distractors. They're all real words, so they only slip
        // through when the "real words allowed" mode is on (teacher-read
        // quizzes); in solo mode the dictionary filter removes them. That's
        // the intended behavior — homophone confusion only makes sense when
        // the student hears the word rather than seeing the context.
        const HOMOPHONE_GROUPS = [
            ['there', 'their', "they're"],
            ['to', 'too', 'two'],
            ['your', "you're"],
            ['its', "it's"],
            ['hear', 'here'],
            ['by', 'buy', 'bye'],
            ['week', 'weak'],
            ['eight', 'ate'],
            ['write', 'right', 'rite'],
            ['knight', 'night'],
            ['sea', 'see'],
            ['be', 'bee'],
            ['know', 'no'],
            ['knew', 'new'],
            ['blew', 'blue'],
            ['flower', 'flour'],
            ['meat', 'meet'],
            ['mail', 'male'],
            ['tail', 'tale'],
            ['role', 'roll'],
            ['hole', 'whole'],
            ['made', 'maid'],
            ['wait', 'weight'],
            ['waste', 'waist'],
            ['peace', 'piece'],
            ['plain', 'plane'],
            ['principle', 'principal'],
            ['fair', 'fare'],
            ['break', 'brake'],
            ['bear', 'bare'],
            ['pair', 'pear', 'pare'],
            ['hair', 'hare'],
            ['son', 'sun'],
            ['one', 'won'],
            ['dear', 'deer'],
            ['allowed', 'aloud'],
            ['board', 'bored'],
            ['ceiling', 'sealing'],
            ['cell', 'sell'],
            ['cent', 'scent', 'sent'],
            ['close', 'clothes'],
            ['die', 'dye'],
            ['flea', 'flee'],
            ['for', 'four'],
            ['heal', 'heel'],
            ['hour', 'our'],
            ['in', 'inn'],
            ['lead', 'led'],
            ['not', 'knot'],
            ['pause', 'paws'],
            ['poor', 'pour'],
            ['road', 'rode', 'rowed'],
            ['sail', 'sale'],
            ['scene', 'seen'],
            ['sew', 'so', 'sow'],
            ['sole', 'soul'],
            ['some', 'sum'],
            ['steal', 'steel'],
            ['threw', 'through'],
            ['tide', 'tied'],
            ['toe', 'tow'],
            ['way', 'weigh'],
            ['wear', 'where'],
            ['whose', "who's"],
            ['you', 'ewe', 'yew'],
            ['aisle', 'isle', "i'll"],
            ['ant', 'aunt'],
            ['bare', 'bear'],
            ['bell', 'belle'],
            ['berry', 'bury'],
            ['birth', 'berth'],
            ['bored', 'board'],
            ['capital', 'capitol'],
            ['creak', 'creek'],
            ['currant', 'current'],
            ['days', 'daze'],
            ['fairy', 'ferry'],
            ['find', 'fined'],
            ['fir', 'fur'],
            ['gnu', 'knew', 'new'],
            ['grate', 'great'],
            ['hay', 'hey'],
            ['higher', 'hire'],
            ['idle', 'idol'],
            ['loan', 'lone'],
            ['mail', 'male'],
            ['meddle', 'medal'],
            ['might', 'mite'],
            ['minor', 'miner'],
            ['morning', 'mourning'],
            ['muscle', 'mussel'],
            ['naval', 'navel'],
            ['pail', 'pale'],
            ['pain', 'pane'],
            ['peek', 'peak', 'pique'],
            ['raise', 'rays', 'raze'],
            ['real', 'reel'],
            ['right', 'write', 'rite'],
            ['ring', 'wring'],
            ['rose', 'rows'],
            ['seam', 'seem'],
            ['stair', 'stare'],
            ['stake', 'steak'],
            ['stationary', 'stationery'],
            ['suite', 'sweet'],
            ['tacks', 'tax'],
            ['team', 'teem'],
            ['tear', 'tier'],
            ['their', 'there', "they're"],
            ['vain', 'vane', 'vein'],
            ['wade', 'weighed'],
            ['warn', 'worn'],
            ['which', 'witch'],
            ['wood', 'would'],
        ];

        // Build target -> [siblings] lookup. Duplicates across groups are fine;
        // we merge into a single list per word.
        const HOMOPHONE_LOOKUP = (() => {
            const m = new Map();
            for (const group of HOMOPHONE_GROUPS) {
                for (const word of group) {
                    const key = word.toLowerCase();
                    if (!m.has(key)) m.set(key, new Set());
                    const set = m.get(key);
                    for (const sibling of group) {
                        const sib = sibling.toLowerCase();
                        if (sib !== key) set.add(sib);
                    }
                }
            }
            return m;
        })();

        function generateMisspellings(word, count, extraExclude, filterRealWords) {
            const lower = word.toLowerCase();
            const scored = new Map(); // text -> best score
            const dict = filterRealWords ? window.HOMEWORK_HELPER_DICTIONARY : null;
            const exclude = extraExclude || new Set();

            // A candidate is "valid" as a distractor only if it is NOT itself a
            // real English word — otherwise the student has two plausible
            // spellings to pick between and can't tell which is the test word.
            // (The dictionary check is skipped when filterRealWords is off, e.g.
            // for teacher-read quizzes where the target is spoken aloud.)
            // The target word and any other word on the same test are always
            // excluded — those are confusing regardless of mode.
            // We also require the candidate to contain at least one vowel so we
            // never emit unpronounceable strings like "bkg".
            function add(text, score) {
                if (!text || text === lower) return;
                if (!/^[a-z'-]+$/.test(text)) return;
                if (!/[aeiouy]/.test(text)) return;
                if (/(.)\1\1/.test(text)) return; // no "glasss"
                if (exclude.has(text)) return;
                if (dict && dict.has(text)) return;
                const prev = scored.get(text);
                if (prev === undefined || score > prev) scored.set(text, score);
            }

            // --- Tier 10: plural traps (wolf/wolves -> wolfs) ---
            for (const trap of pluralTraps(lower)) add(trap, 10);

            // --- Tier 10: suffix traps ---
            for (const [from, to] of SUFFIX_SWAPS) {
                if (lower.endsWith(from) && lower.length > from.length + 1) {
                    add(lower.slice(0, -from.length) + to, 10);
                }
            }

            // --- Tier 10: homophones ---
            // These only survive when filter-real-words is off (teacher-read
            // mode). In solo mode the dict filter strips them, which is the
            // correct behavior — you can't distinguish homophones visually
            // without context.
            const homs = HOMOPHONE_LOOKUP.get(lower);
            if (homs) for (const h of homs) add(h, 10);

            // --- Phonetic / digraph swaps (kid-by-ear spellings) ---
            // Scores vary per entry; see PHONETIC_SWAPS. Apply to every
            // occurrence of each pattern in the word.
            for (const [from, to, score] of PHONETIC_SWAPS) {
                let idx = lower.indexOf(from);
                while (idx !== -1) {
                    const candidate = lower.slice(0, idx) + to + lower.slice(idx + from.length);
                    add(candidate, score);
                    idx = lower.indexOf(from, idx + 1);
                }
            }

            // --- Tier 9: classic phonetic traps ---
            // ie <-> ei (receive/recieve, believe/beleive)
            for (let i = 0; i < lower.length - 1; i++) {
                if (lower[i] === 'i' && lower[i + 1] === 'e') add(replaceRange(lower, i, 2, 'ei'), 9);
                if (lower[i] === 'e' && lower[i + 1] === 'i') add(replaceRange(lower, i, 2, 'ie'), 9);
            }
            // ph -> f (and f -> ph after a vowel)
            if (lower.includes('ph')) add(lower.replace('ph', 'f'), 9);
            for (let i = 1; i < lower.length; i++) {
                if (lower[i] === 'f' && isVowel(lower[i - 1]) && lower[i - 1] !== lower[i + 1]) {
                    add(replaceChar(lower, i, 'ph'), 7);
                }
            }
            // Silent trailing e drop (but only when the preceding letter isn't a vowel,
            // so "see" doesn't become "se").
            if (lower.length > 3 && lower.endsWith('e') && isConsonant(lower[lower.length - 2])) {
                add(lower.slice(0, -1), 9);
            }
            // Soft c <-> s (before e/i/y)
            for (let i = 0; i < lower.length; i++) {
                const nxt = lower[i + 1];
                if (lower[i] === 'c' && 'eiy'.includes(nxt || '')) add(replaceChar(lower, i, 's'), 9);
                if (lower[i] === 's' && 'eiy'.includes(nxt || '') && i > 0) add(replaceChar(lower, i, 'c'), 7);
            }

            // --- Tier 8: schwa-vowel confusion ---
            // Unstressed vowels (flanked by consonants) sound like schwa and get
            // respelled as a, e, or i. Covers separate->seperate, independent->
            // independant, definite->definate, grammar->grammer, etc.
            for (let i = 1; i < lower.length - 1; i++) {
                if (!isVowel(lower[i])) continue;
                if (!isConsonant(lower[i - 1]) || !isConsonant(lower[i + 1])) continue;
                for (const sub of 'aei') {
                    if (sub !== lower[i]) add(replaceChar(lower, i, sub), 8);
                }
            }
            // Drop an unstressed interior vowel flanked by consonants (chocolate->choclate,
            // different->diffrent, family->famly). Require a vowel earlier in the word
            // so we never drop the first vowel (which would produce nonsense like "dfferent").
            for (let i = 2; i < lower.length - 1; i++) {
                if (isVowel(lower[i]) && isConsonant(lower[i - 1]) && isConsonant(lower[i + 1])) {
                    const hasEarlierVowel = [...lower.slice(0, i)].some(isVowel);
                    if (hasEarlierVowel) add(dropChar(lower, i), 8);
                }
            }
            // Drop silent h in rh-/gh-/wh- style clusters (rhythm->rythm, ghost->gost).
            for (let i = 1; i < lower.length; i++) {
                if (lower[i] === 'h' && 'rgw'.includes(lower[i - 1])) {
                    add(dropChar(lower, i), 8);
                }
            }
            // Silent b at end of -mb (lamb->lam, thumb->thum, comb->com, climb->clim).
            if (lower.length > 3 && lower.endsWith('mb')) {
                add(lower.slice(0, -1), 8);
            }
            // Silent l in -lk and -lm, anywhere in the word (walk->wak, talk->tak,
            // chalk->chak, calm->cam, palm->pam).
            for (let i = 0; i < lower.length - 1; i++) {
                if (lower[i] === 'l' && (lower[i + 1] === 'k' || lower[i + 1] === 'm')) {
                    add(dropChar(lower, i), 8);
                }
            }
            // Silent g in gn at word start or word end only — gn is pronounced
            // mid-word (e.g. "magnet"), so we don't fire there.
            // Covers: gnome->nome, gnat->nat, sign->sin, design->desin,
            // foreign->forein, reign->rein, assign->asin, align->alin.
            for (let i = 0; i < lower.length - 1; i++) {
                if (lower[i] === 'g' && lower[i + 1] === 'n' &&
                    (i === 0 || i + 2 === lower.length)) {
                    add(dropChar(lower, i), 7);
                }
            }
            // Silent n in final -mn (autumn->autum, column->colum, hymn->hym,
            // solemn->solem, condemn->condem).
            if (lower.length > 3 && lower.endsWith('mn')) {
                add(lower.slice(0, -1), 7);
            }
            // Silent b in -bt- (doubt->dout, debt->det, subtle->sutle).
            for (let i = 1; i < lower.length - 1; i++) {
                if (lower[i] === 'b' && lower[i + 1] === 't') {
                    add(dropChar(lower, i), 7);
                }
            }
            // Silent t in stle/sten/ften clusters (castle->casle, whistle->whisle,
            // listen->lisen, fasten->fasen, often->ofen, soften->sofen).
            for (const cluster of ['stle', 'sten', 'ften']) {
                const idx = lower.indexOf(cluster);
                if (idx !== -1) add(dropChar(lower, idx + 1), 7);
            }

            // --- Tier 8: double-consonant errors (as common as schwa confusion) ---
            // Drop one of a doubled consonant (necessary->necesary, accommodate->acommodate).
            for (let i = 0; i < lower.length - 1; i++) {
                if (lower[i] === lower[i + 1] && isConsonant(lower[i])) {
                    add(dropChar(lower, i), 8);
                }
            }
            // Double a lone intervocalic consonant (occur->occurr, travel->travell,
            // necessary->neccessary).
            for (let i = 1; i < lower.length - 1; i++) {
                const c = lower[i];
                if (isConsonant(c) && isVowel(lower[i - 1]) && isVowel(lower[i + 1]) &&
                    lower[i - 1] !== lower[i + 1] && c !== 'w' && c !== 'h') {
                    add(doubleChar(lower, i), 8);
                }
            }
            // Double the final consonant (fat->fatt, big->bigg, dog->dogg).
            // Very common kid-level misspelling, and crucial for short words
            // where most other transforms either produce real words or fail.
            const last = lower.length - 1;
            if (last >= 1 && isConsonant(lower[last]) && lower[last] !== lower[last - 1] &&
                lower[last] !== 'h' && lower[last] !== 'w' && lower[last] !== 'y') {
                add(lower + lower[last], 7);
            }

            // --- Tier 6: other vowel swaps ---
            for (let i = 1; i < lower.length - 1; i++) {
                if (lower[i] === 'i' && isConsonant(lower[i - 1])) add(replaceChar(lower, i, 'e'), 6);
                if (lower[i] === 'e' && isConsonant(lower[i - 1]) && i < lower.length - 2) add(replaceChar(lower, i, 'i'), 6);
                if (lower[i] === 'o') add(replaceChar(lower, i, 'u'), 6);
                if (lower[i] === 'u') add(replaceChar(lower, i, 'o'), 6);
            }

            // --- Tier 5: hard-c/k, y/ie at end, transpositions ---
            for (let i = 0; i < lower.length; i++) {
                const nxt = lower[i + 1] || '';
                if (lower[i] === 'c' && !'eiy'.includes(nxt)) add(replaceChar(lower, i, 'k'), 5);
                if (lower[i] === 'k') add(replaceChar(lower, i, 'c'), 4);
            }
            if (lower.endsWith('y') && lower.length > 3 && isConsonant(lower[lower.length - 2])) {
                add(lower.slice(0, -1) + 'ie', 5);
                add(lower.slice(0, -1) + 'ey', 5);
            }
            // Adjacent transpositions beyond ie/ei (covers keyboard-order confusion
            // and things like "wierd"-style swaps we didn't catch above).
            for (let i = 1; i < lower.length - 2; i++) {
                if (lower[i] !== lower[i + 1]) add(transposeAdjacent(lower, i), 5);
            }

            // --- Tier 3: keyboard-adjacent typo (capped fallback) ---
            // Only contribute a couple of these and only if we truly need them.
            const keyboardCandidates = [];
            for (let i = 0; i < lower.length; i++) {
                const adj = KEY_ADJ[lower[i]];
                if (!adj) continue;
                for (const k of adj) {
                    keyboardCandidates.push(replaceChar(lower, i, k));
                }
            }
            shuffle(keyboardCandidates);
            for (const c of keyboardCandidates.slice(0, 2)) add(c, 3);

            // --- Select `count` candidates, biased toward high-scoring ones ---
            // Group by score tier (highest first) and shuffle within a tier so
            // the same word can yield different distractors on reset.
            const byScore = new Map();
            for (const [text, score] of scored.entries()) {
                if (!byScore.has(score)) byScore.set(score, []);
                byScore.get(score).push(text);
            }
            const tiers = [...byScore.keys()].sort((a, b) => b - a);

            const picks = [];
            for (const score of tiers) {
                const bucket = byScore.get(score);
                shuffle(bucket);
                for (const text of bucket) {
                    if (picks.length >= count) break;
                    picks.push(text);
                }
                if (picks.length >= count) break;
            }

            // Safety net: short, common words ("dog", "run") often lose most
            // candidates to the dictionary filter. Generate pronounceable
            // fallbacks by doubling letters or appending a vowel / silent-e
            // style ending. These always look like plausible student errors,
            // unlike a random trailing consonant.
            function tryAdd(candidate) {
                if (!candidate || candidate === lower) return;
                if (!/[aeiouy]/.test(candidate)) return;
                if (/(.)\1\1/.test(candidate)) return;
                if (exclude.has(candidate)) return;
                if (dict && dict.has(candidate)) return;
                if (picks.includes(candidate)) return;
                picks.push(candidate);
            }

            const fallbacks = [];
            // Double any single letter (cat -> caat/catt/ccat)
            for (let i = 0; i < lower.length; i++) {
                if (lower[i] !== lower[i - 1] && lower[i] !== lower[i + 1]) {
                    fallbacks.push(doubleChar(lower, i));
                }
            }
            // Append a vowel (fat -> fata, big -> bigo)
            for (const v of 'aeio') fallbacks.push(lower + v);
            // Append a final 'e' or 'ie' / 'ey' for a "thought it was a word" error
            fallbacks.push(lower + 'e');
            if (!lower.endsWith('e')) fallbacks.push(lower + 'ie');
            if (lower.endsWith('y')) fallbacks.push(lower.slice(0, -1) + 'ie');
            // Insert an extra vowel mid-word (fat -> faet, big -> biag)
            for (let i = 1; i < lower.length; i++) {
                for (const v of 'aei') {
                    if (lower[i - 1] !== v && lower[i] !== v) {
                        fallbacks.push(lower.slice(0, i) + v + lower.slice(i));
                    }
                }
            }
            shuffle(fallbacks);
            for (const cand of fallbacks) {
                if (picks.length >= count) break;
                tryAdd(cand);
            }
            return picks.slice(0, count);
        }

        // ---------- Utilities ----------
        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // ---------- Test building ----------
        function buildTest() {
            const words = [...activeWords()];
            const challenge = activeChallengeSet();
            const typed = currentMode() === 'typed';
            shuffle(words);
            // Exclude all other test words from each question's distractors so
            // a misspelling of one word can't happen to match another target.
            const allTargets = new Set(words.map(w => w.toLowerCase()));
            state.test = words.map(word => {
                const lower = word.toLowerCase();
                let choices = [];
                if (!typed) {
                    const exclude = new Set(allTargets);
                    exclude.delete(lower);
                    const misspellings = generateMisspellings(word, 3, exclude, state.filterRealWords);
                    choices = shuffle([lower, ...misspellings]);
                }
                return { word: lower, choices, selected: null, typed: '', challenge: challenge.has(lower) };
            });
            state.graded = false;
        }

        // ---------- List switching / sidebar ----------
        const fmtShort = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        const fmtTest = d => d.toLocaleDateString('en-US', { weekday: 'short', month: 'numeric', day: 'numeric' });
        const fmtLong = d => d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

        function weekStart(d) {
            const monday = new Date(d);
            monday.setDate(d.getDate() - ((d.getDay() + 6) % 7));
            return monday;
        }

        function renderSidebar() {
            const ul = document.getElementById('spelling-sub-list');
            const today = todayLocal();
            const upcoming = getUpcomingList();

            const items = [`
                <li>
                    <button class="sub-item ${state.listId === CUSTOM_LIST_ID ? 'active' : ''}" data-list="${CUSTOM_LIST_ID}">
                        <span class="sub-title">My Words</span>
                        <span class="sub-meta">Your own list</span>
                    </button>
                </li>`];

            for (const list of SPELLING_LISTS) {
                const isToday = list.date.getTime() === today.getTime();
                const badge = list === upcoming
                    ? `<span class="badge-now">${isToday ? 'Test today' : 'Up next'}</span>`
                    : '';
                const cls = ['sub-item'];
                if (list.id === state.listId) cls.push('active');
                if (list.date < today) cls.push('past');
                items.push(`
                    <li>
                        <button class="${cls.join(' ')}" data-list="${escapeHtml(list.id)}">
                            <span class="sub-title">Week of ${fmtShort(weekStart(list.date))} ${badge}</span>
                            <span class="sub-meta">Lesson ${list.lesson} &middot; Test ${fmtTest(list.date)}</span>
                        </button>
                    </li>`);
            }
            ul.innerHTML = items.join('');

            ul.querySelectorAll('.sub-item').forEach(btn => {
                btn.addEventListener('click', () => {
                    selectList(btn.dataset.list);
                    closeDrawer();
                });
            });
        }

        function renderHeader() {
            const list = getList(state.listId);
            const subtitle = document.getElementById('subtitle');
            const addBtn = document.getElementById('add-words-btn');
            if (list) {
                subtitle.textContent = `Unit ${list.unit}, Lesson ${list.lesson} · Test on ${fmtLong(list.date)}`;
                addBtn.style.display = 'none';
            } else {
                subtitle.textContent = 'Add your spelling words, then take the quiz.';
                addBtn.style.display = '';
            }

            const mode = currentMode();
            document.querySelectorAll('#mode-switch button').forEach(btn => {
                const on = btn.dataset.mode === mode;
                btn.classList.toggle('active', on);
                btn.setAttribute('aria-checked', String(on));
            });
            // The real-word filter only matters for multiple choice.
            document.getElementById('filter-option').classList.toggle('hidden', mode === 'typed');
        }

        // Switching quiz style is guarded by the Guardian PIN (when one is
        // set) so a kid can't flip a typed test back to multiple choice.
        function setQuizMode(mode) {
            if (mode === currentMode()) return;
            const apply = () => {
                quizModes[state.listId] = mode;
                saveModes();
                buildTest();
                renderHeader();
                render();
                document.querySelector('.main-scroll').scrollTo({ top: 0 });
            };
            if (getStoredPinHash()) openPinModal('auth', apply);
            else apply();
        }

        function selectList(id) {
            if (id === state.listId) return;
            if (id !== CUSTOM_LIST_ID && !getList(id)) return;
            sessions.set(state.listId, { test: state.test, graded: state.graded });
            state.listId = id;
            saveListPref();
            const saved = sessions.get(id);
            if (saved) {
                state.test = saved.test;
                state.graded = saved.graded;
            } else {
                buildTest();
            }
            renderSidebar();
            renderHeader();
            render();
            prefetchRecordings(activeWords());
            document.querySelector('.main-scroll').scrollTo({ top: 0 });
        }

        // ---------- Rendering ----------
        function render() {
            const container = document.getElementById('test-container');
            const resetBtn = document.getElementById('reset-btn');
            const bottomBar = document.getElementById('main-bottom');

            if (activeWords().length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        No words yet. Click <strong>Add Words</strong> to get started.
                    </div>`;
                bottomBar.style.display = 'none';
                resetBtn.style.display = 'none';
                return;
            }

            bottomBar.style.display = 'flex';
            resetBtn.style.display = 'inline-block';

            updateCheckButton();

            const correctCount = state.graded
                ? state.test.reduce((n, q) => n + (isCorrect(q) ? 1 : 0), 0)
                : 0;

            const percent = state.test.length
                ? Math.round((correctCount / state.test.length) * 100)
                : 0;
            const scoreHtml = state.graded
                ? `<div class="score-banner graded">
                       <span>Score</span>
                       <span class="score-value">${correctCount} / ${state.test.length} <span class="score-percent">(${percent}%)</span></span>
                   </div>`
                : `<div class="score-banner">
                       <span>Ready to take the test</span>
                       <span class="score-value">${state.test.length} word${state.test.length === 1 ? '' : 's'}</span>
                   </div>`;

            const typedMode = currentMode() === 'typed';
            const questionsHtml = state.test
                .map((q, qIdx) => typedMode ? typedQuestionHtml(q, qIdx) : choiceQuestionHtml(q, qIdx))
                .join('');

            container.innerHTML = scoreHtml + questionsHtml;

            // Wire up choice clicks
            container.querySelectorAll('input[type="radio"]').forEach(input => {
                input.addEventListener('change', (e) => {
                    if (state.graded) return;
                    const [, qIdx] = e.target.name.match(/^q(\d+)$/);
                    state.test[parseInt(qIdx)].selected = parseInt(e.target.value);
                    render();
                });
            });

            // Wire up typed answers. Don't re-render while typing (that would
            // drop focus); just record the text and refresh the Check button.
            container.querySelectorAll('.typed-input').forEach(input => {
                const idx = parseInt(input.dataset.idx);
                input.addEventListener('input', () => {
                    state.test[idx].typed = input.value;
                    updateCheckButton();
                });
                // Enter / "Next" on a phone keyboard moves to the next word.
                input.addEventListener('keydown', (e) => {
                    if (e.key !== 'Enter') return;
                    e.preventDefault();
                    const next = container.querySelector(`.typed-input[data-idx="${idx + 1}"]`);
                    if (next) next.focus();
                    else input.blur();
                });
            });

            // Wire up listen buttons. They carry only the question number,
            // never the word itself.
            container.querySelectorAll('.btn-listen').forEach(btn => {
                btn.addEventListener('click', () => {
                    const q = state.test[parseInt(btn.dataset.idx)];
                    if (q) speakWord(q.word, btn);
                });
            });
        }

        function updateCheckButton() {
            const checkBtn = document.getElementById('check-btn');
            const allAnswered = state.test.every(isAnswered);
            checkBtn.disabled = !allAnswered || state.graded;
            checkBtn.title = allAnswered ? '' : 'Answer every question first';
        }

        const LISTEN_ICON = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M3 10v4h4l5 4V6L7 10H3zm11 2a3 3 0 0 0-2-2.82v5.64A3 3 0 0 0 14 12zm-2-7.5v1.54c2.3.57 4 2.67 4 5.26s-1.7 4.69-4 5.26v1.54c3.16-.65 5.5-3.44 5.5-6.8S15.16 4.75 12 4.5z"/></svg>';

        function questionLabel(q, qIdx) {
            return `Question ${qIdx + 1}${q.challenge ? '<span class="tag-challenge">Challenge</span>' : ''}`;
        }

        function choiceQuestionHtml(q, qIdx) {
            const choicesHtml = q.choices.map((choice, cIdx) => {
                const isSelected = q.selected === cIdx;
                const isRight = choice === q.word;
                let cls = 'choice';
                let mark = '';
                if (state.graded) {
                    if (isRight) {
                        cls += ' correct';
                        mark = '<span class="mark">&#10003;</span>';
                    } else if (isSelected) {
                        cls += ' incorrect';
                        mark = '<span class="mark">&#10007;</span>';
                    }
                } else if (isSelected) {
                    cls += ' selected';
                }
                return `
                    <label class="${cls}">
                        <input type="radio" name="q${qIdx}" value="${cIdx}" ${isSelected ? 'checked' : ''} ${state.graded ? 'disabled' : ''}>
                        <span>${escapeHtml(choice)}</span>
                        ${mark}
                    </label>`;
            }).join('');

            return `
                <div class="question ${state.graded ? 'graded' : ''}">
                    <div class="question-header">
                        <span>${questionLabel(q, qIdx)}</span>
                        <button class="btn-listen" data-idx="${qIdx}" aria-label="Play word">${LISTEN_ICON}</button>
                    </div>
                    <div class="choices">${choicesHtml}</div>
                </div>`;
        }

        // Typed question. Before grading, the word is nowhere in the page:
        // no attributes, no tooltips, and the box has spell-check,
        // autocorrect and autocomplete off so the browser can't hint either.
        // It has no name/id, so the browser keeps no history of past answers.
        function typedQuestionHtml(q, qIdx) {
            const listenBtn = `<button class="btn-listen btn-listen-lg" data-idx="${qIdx}" aria-label="Play word">${LISTEN_ICON}</button>`;

            if (!state.graded) {
                return `
                    <div class="question">
                        <div class="question-header"><span>${questionLabel(q, qIdx)}</span></div>
                        <div class="typed-row">
                            ${listenBtn}
                            <input class="typed-input" type="text" data-idx="${qIdx}"
                                value="${escapeHtml(q.typed || '')}"
                                aria-label="Answer ${qIdx + 1}"
                                autocomplete="off" autocorrect="off" autocapitalize="none"
                                spellcheck="false" enterkeyhint="next"
                                data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false">
                        </div>
                    </div>`;
            }

            const right = isCorrect(q);
            const answer = normalizeAnswer(q.typed);
            return `
                <div class="question graded">
                    <div class="question-header"><span>${questionLabel(q, qIdx)}</span></div>
                    <div class="typed-row">
                        ${listenBtn}
                        <div class="typed-answer ${right ? 'correct' : 'incorrect'}">
                            <span>${escapeHtml(answer)}</span>
                            <span class="mark">${right ? '&#10003;' : '&#10007;'}</span>
                        </div>
                    </div>
                    ${right ? '' : `<div class="correct-spelling">Correct spelling: <strong>${escapeHtml(q.word)}</strong></div>`}
                </div>`;
        }

        function escapeHtml(s) {
            return s.replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        // ---------- Speech ----------
        // Words on the weekly lists are pre-recorded with a clear neural
        // voice (tools/make_spelling_audio.py) as audio/<hash>.mp3. The hash
        // hides the word, and clips play from in-memory copies so no file
        // name shows up in the phone's "Now Playing" either. Words without a
        // recording (e.g. My Words) use the device's own text-to-speech,
        // picking the clearest English voice it has.
        const AUDIO_SALT = 'hh-audio::';
        const TTS_AVAILABLE = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';

        const recordingUrls = new Map(); // word -> audio/<hash>.mp3 (only words that have one)
        const recordingBlobs = new Map(); // word -> blob: URL once downloaded
        const player = new Audio(); // one element, reused: iOS unlocks it on the first tap
        player.preload = 'auto';
        let recordingsReady = null;

        // Plays through the iPhone silent switch, like a video would.
        try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}

        function loadRecordings() {
            recordingsReady = (async () => {
                try {
                    if (!(window.crypto && crypto.subtle)) return;
                    const res = await fetch('audio/index.json', { cache: 'no-cache' });
                    if (!res.ok) return;
                    const available = new Set(await res.json());
                    const words = new Set(SPELLING_LISTS.flatMap(l => l.allWords));
                    for (const w of words) {
                        const name = (await sha256Hex(AUDIO_SALT + w)).slice(0, 16);
                        if (available.has(name)) recordingUrls.set(w, `audio/${name}.mp3`);
                    }
                } catch (e) {
                    // No recordings: everything uses the device voice.
                }
            })();
            return recordingsReady;
        }

        // Download the current list's clips ahead of time so taps play
        // instantly.
        async function prefetchRecordings(words) {
            await recordingsReady;
            for (const w of words) {
                const url = recordingUrls.get(w);
                if (!url || recordingBlobs.has(w)) continue;
                recordingBlobs.set(w, null); // in flight
                fetch(url)
                    .then(r => (r.ok ? r.blob() : Promise.reject()))
                    .then(b => recordingBlobs.set(w, URL.createObjectURL(b)))
                    .catch(() => recordingBlobs.delete(w));
            }
        }

        // Rank the device's voices. Natural/neural/enhanced voices (Edge,
        // Apple downloads, Google's network voice) are far clearer than the
        // default robotic ones; macOS novelty voices are excluded.
        let deviceVoice = null;
        const NOVELTY_VOICES = /\b(albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|jester|organ|superstar|trinoids|whisper|wobble|zarvox|fred|junior|ralph|kathy|grandma|grandpa|rocko|shelley|flo|eddy|reed|sandy)\b|eloquence/i;
        function pickDeviceVoice() {
            if (!TTS_AVAILABLE) return;
            let best = null, bestScore = -Infinity;
            for (const v of window.speechSynthesis.getVoices()) {
                const lang = (v.lang || '').replace('_', '-').toLowerCase();
                if (!lang.startsWith('en')) continue;
                let score = lang === 'en-us' ? 20 : 5;
                if (/natural|neural|premium|enhanced/i.test(v.name)) score += 40;
                if (/google us english/i.test(v.name)) score += 30;
                if (/\b(samantha|ava|allison|susan|zoe|evan|nathan|joelle|noelle|aria|jenny|guy|michelle)\b/i.test(v.name)) score += 15;
                if (/compact/i.test(v.name)) score -= 20;
                if (NOVELTY_VOICES.test(v.name)) score -= 100;
                if (v.default) score += 2;
                if (score > bestScore) { bestScore = score; best = v; }
            }
            deviceVoice = best;
        }
        if (TTS_AVAILABLE) {
            pickDeviceVoice();
            // Voices load asynchronously in Chrome/Safari.
            if (window.speechSynthesis.addEventListener) {
                window.speechSynthesis.addEventListener('voiceschanged', pickDeviceVoice);
            } else {
                window.speechSynthesis.onvoiceschanged = pickDeviceVoice;
            }
        }

        function stopSpeaking() {
            player.pause();
            if (TTS_AVAILABLE) window.speechSynthesis.cancel();
            document.querySelectorAll('.btn-listen.speaking').forEach(b => b.classList.remove('speaking'));
        }

        function speakWithDevice(word, buttonEl) {
            if (!TTS_AVAILABLE) return;
            const utter = new SpeechSynthesisUtterance(word);
            if (deviceVoice) utter.voice = deviceVoice;
            utter.lang = deviceVoice ? deviceVoice.lang : 'en-US';
            utter.rate = 0.85; // a little slower than default, easier to catch
            if (buttonEl) {
                buttonEl.classList.add('speaking');
                const clear = () => buttonEl.classList.remove('speaking');
                utter.onend = clear;
                utter.onerror = clear;
            }
            window.speechSynthesis.speak(utter);
        }

        // Everything here runs synchronously inside the tap, which iOS
        // requires before it will make sound.
        function speakWord(word, buttonEl) {
            if (!word) return;
            stopSpeaking();
            const url = recordingUrls.get(word);
            if (!url) {
                speakWithDevice(word, buttonEl);
                return;
            }
            player.src = recordingBlobs.get(word) || url;
            try {
                if ('mediaSession' in navigator && window.MediaMetadata) {
                    navigator.mediaSession.metadata = new MediaMetadata({ title: 'Spelling Test' });
                }
            } catch (e) {}
            if (buttonEl) {
                buttonEl.classList.add('speaking');
                const clear = () => buttonEl.classList.remove('speaking');
                player.onended = clear;
                player.onerror = clear;
            }
            player.play().catch(() => {
                if (buttonEl) buttonEl.classList.remove('speaking');
                speakWithDevice(word, buttonEl);
            });
        }

        // ---------- Modal ----------
        function renderExistingWords() {
            const container = document.getElementById('existing-words');
            if (state.words.length === 0) {
                container.innerHTML = `<div class="existing-words-empty">No words added yet.</div>`;
                return;
            }
            container.innerHTML = state.words.map((w, i) => `
                <div class="existing-word">
                    <span>${escapeHtml(w)}</span>
                    <button class="btn-danger-ghost" data-idx="${i}">Remove</button>
                </div>`).join('');

            container.querySelectorAll('button[data-idx]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = parseInt(btn.dataset.idx);
                    state.words.splice(idx, 1);
                    saveWords();
                    renderExistingWords();
                });
            });
        }

        function openModal() {
            renderExistingWords();
            document.getElementById('words-input').value = '';
            document.getElementById('modal').classList.add('open');
            document.getElementById('words-input').focus();
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('open');
            // If the word list changed (add/remove), rebuild the test.
            buildTest();
            render();
        }

        function addWordsFromInput() {
            const input = document.getElementById('words-input');
            const raw = input.value;
            const newWords = raw
                .split(/[\n,]/)
                .map(w => w.trim().toLowerCase())
                .filter(w => w.length > 0 && /^[a-z'-]+$/.test(w));

            for (const w of newWords) {
                if (!state.words.includes(w)) state.words.push(w);
            }
            saveWords();
            input.value = '';
            renderExistingWords();
        }

        // ---------- Guardian PIN ----------
        // A one-way SHA-256 hash of (salt + pin) is stored in localStorage.
        // This is not cryptographically serious security — anyone with devtools
        // can clear the storage key. It's just enough friction to stop a kid
        // from clicking Add Words and seeing the answer list.

        async function sha256Hex(text) {
            const buf = new TextEncoder().encode(text);
            const hash = await crypto.subtle.digest('SHA-256', buf);
            return [...new Uint8Array(hash)]
                .map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function hashPin(pin) { return sha256Hex(PIN_SALT + pin); }
        function getStoredPinHash() { return localStorage.getItem(PIN_STORAGE_KEY); }
        function setStoredPinHash(hash) {
            if (hash) localStorage.setItem(PIN_STORAGE_KEY, hash);
            else localStorage.removeItem(PIN_STORAGE_KEY);
        }

        function updatePinStatusBadge() {
            const badge = document.getElementById('pin-status-badge');
            document.body.classList.toggle('pin-on', !!getStoredPinHash());
            if (getStoredPinHash()) {
                badge.textContent = 'on';
                badge.classList.remove('off');
            } else {
                badge.textContent = 'off';
                badge.classList.add('off');
            }
        }

        // Reusable PIN modal. Mode controls which fields/text show up:
        //   'auth'   — one field: current PIN (used before protected actions)
        //   'set'    — two fields: new PIN + confirm (no existing PIN yet)
        //   'change' — three fields: current + new + confirm
        let pinModalOnSuccess = null;
        let pinModalMode = 'auth';

        function configurePinModal(mode) {
            pinModalMode = mode;
            const title = document.getElementById('pin-modal-title');
            const hint = document.getElementById('pin-modal-hint');
            const curField = document.getElementById('pin-current-field');
            const newField = document.getElementById('pin-new-field');
            const confirmField = document.getElementById('pin-confirm-field');
            const removeBtn = document.getElementById('pin-remove');

            document.getElementById('pin-current').value = '';
            document.getElementById('pin-new').value = '';
            document.getElementById('pin-confirm').value = '';
            document.getElementById('pin-error').textContent = '';

            if (mode === 'auth') {
                title.textContent = 'Enter Guardian PIN';
                hint.textContent = 'This action is protected. Enter the PIN to continue.';
                curField.style.display = '';
                newField.style.display = 'none';
                confirmField.style.display = 'none';
                removeBtn.style.display = 'none';
            } else if (mode === 'set') {
                title.textContent = 'Set Guardian PIN';
                hint.textContent = 'Choose a PIN (4+ characters). You will need it to add or change words and quiz settings.';
                curField.style.display = 'none';
                newField.style.display = '';
                confirmField.style.display = '';
                removeBtn.style.display = 'none';
            } else if (mode === 'change') {
                title.textContent = 'Change Guardian PIN';
                hint.textContent = 'Enter the current PIN, then choose a new one.';
                curField.style.display = '';
                newField.style.display = '';
                confirmField.style.display = '';
                removeBtn.style.display = '';
            }
        }

        function openPinModal(mode, onSuccess) {
            pinModalOnSuccess = onSuccess || null;
            configurePinModal(mode);
            document.getElementById('pin-modal').classList.add('open');
            const firstVisible = mode === 'set'
                ? document.getElementById('pin-new')
                : document.getElementById('pin-current');
            setTimeout(() => firstVisible.focus(), 0);
        }

        function closePinModal() {
            document.getElementById('pin-modal').classList.remove('open');
            pinModalOnSuccess = null;
        }

        async function submitPinModal() {
            const errEl = document.getElementById('pin-error');
            errEl.textContent = '';
            const cur = document.getElementById('pin-current').value;
            const fresh = document.getElementById('pin-new').value;
            const confirm = document.getElementById('pin-confirm').value;

            if (pinModalMode === 'auth' || pinModalMode === 'change') {
                const storedHash = getStoredPinHash();
                if (!storedHash) { errEl.textContent = 'No PIN set.'; return; }
                const curHash = await hashPin(cur);
                if (curHash !== storedHash) {
                    errEl.textContent = 'Incorrect PIN.';
                    return;
                }
            }

            if (pinModalMode === 'set' || pinModalMode === 'change') {
                if (fresh.length < 4) {
                    errEl.textContent = 'New PIN must be at least 4 characters.';
                    return;
                }
                if (fresh !== confirm) {
                    errEl.textContent = 'New PIN and confirmation do not match.';
                    return;
                }
                setStoredPinHash(await hashPin(fresh));
                updatePinStatusBadge();
            }

            const cb = pinModalOnSuccess;
            closePinModal();
            if (cb) cb();
        }

        // Route the Add Words click through the PIN gate only if a PIN has
        // been set. Before a guardian configures one, the button works as
        // normal.
        function handleAddWordsClick() {
            if (getStoredPinHash()) {
                openPinModal('auth', openModal);
            } else {
                openModal();
            }
        }

        function handleGuardianPinClick() {
            if (getStoredPinHash()) {
                openPinModal('change');
            } else {
                openPinModal('set');
            }
        }

        // ---------- Events ----------
        document.getElementById('add-words-btn').addEventListener('click', handleAddWordsClick);
        document.getElementById('modal-cancel').addEventListener('click', closeModal);
        document.getElementById('modal-add').addEventListener('click', addWordsFromInput);
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') closeModal();
        });

        // Mobile sidebar drawer (hamburger + backdrop). The drawer styling
        // only kicks in below the responsive breakpoint; on desktop the
        // sidebar is always visible and these handlers are inert.
        const sidebarEl = document.querySelector('.sidebar');
        const sidebarBackdrop = document.getElementById('sidebar-backdrop');
        const hamburgerBtn = document.getElementById('hamburger-btn');

        function openDrawer() {
            sidebarEl.classList.add('open');
            sidebarBackdrop.classList.add('open');
        }
        function closeDrawer() {
            sidebarEl.classList.remove('open');
            sidebarBackdrop.classList.remove('open');
        }

        hamburgerBtn.addEventListener('click', openDrawer);
        sidebarBackdrop.addEventListener('click', closeDrawer);

        // Flyout menu (settings dropdown next to the sidebar header)
        const flyoutBtn = document.getElementById('flyout-btn');
        const flyoutMenu = document.getElementById('flyout-menu');

        function closeFlyout() {
            flyoutMenu.classList.remove('open');
            flyoutBtn.classList.remove('open');
            flyoutBtn.setAttribute('aria-expanded', 'false');
        }

        flyoutBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = flyoutMenu.classList.toggle('open');
            flyoutBtn.classList.toggle('open', isOpen);
            flyoutBtn.setAttribute('aria-expanded', String(isOpen));
        });

        // Clicks anywhere outside the flyout close it. Clicks inside on a
        // menu item run their own handler first (e.g. open PIN modal) and
        // we close the flyout afterward.
        document.addEventListener('click', (e) => {
            if (!flyoutMenu.classList.contains('open')) return;
            if (flyoutMenu.contains(e.target) || flyoutBtn.contains(e.target)) return;
            closeFlyout();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape') return;
            if (flyoutMenu.classList.contains('open')) closeFlyout();
            else if (sidebarEl.classList.contains('open')) closeDrawer();
        });

        document.getElementById('guardian-pin-btn').addEventListener('click', () => {
            closeFlyout();
            closeDrawer();
            handleGuardianPinClick();
        });
        document.getElementById('pin-cancel').addEventListener('click', closePinModal);
        document.getElementById('pin-submit').addEventListener('click', submitPinModal);
        document.getElementById('pin-modal').addEventListener('click', (e) => {
            if (e.target.id === 'pin-modal') closePinModal();
        });
        document.getElementById('pin-modal').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); submitPinModal(); }
            else if (e.key === 'Escape') { closePinModal(); }
        });
        document.getElementById('pin-remove').addEventListener('click', async () => {
            const errEl = document.getElementById('pin-error');
            const cur = document.getElementById('pin-current').value;
            const storedHash = getStoredPinHash();
            if (!storedHash) { closePinModal(); return; }
            const curHash = await hashPin(cur);
            if (curHash !== storedHash) { errEl.textContent = 'Incorrect PIN.'; return; }
            setStoredPinHash(null);
            updatePinStatusBadge();
            closePinModal();
        });

        document.getElementById('check-btn').addEventListener('click', () => {
            state.graded = true;
            render();
            document.querySelector('.main-scroll').scrollTo({ top: 0, behavior: 'smooth' });
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            buildTest();
            render();
        });

        const filterToggle = document.getElementById('filter-words-toggle');

        function applyFilterToggle(checked) {
            filterToggle.checked = checked;
            state.filterRealWords = checked;
            saveFilterPref();
            sessions.clear();
            buildTest();
            render();
        }

        // Intercept before the checkbox visually flips. If a PIN is set, block
        // the toggle and prompt. On successful auth, apply the intended state.
        // Note: browsers differ on whether `filterToggle.checked` has already
        // been flipped by the time the click event fires, so we derive the
        // intended state from our authoritative `state.filterRealWords` and
        // also re-sync the DOM in case the browser got ahead of us.
        filterToggle.addEventListener('click', (e) => {
            if (!getStoredPinHash()) return; // no PIN: let default behavior run
            e.preventDefault();
            const intended = !state.filterRealWords;
            filterToggle.checked = state.filterRealWords;
            openPinModal('auth', () => applyFilterToggle(intended));
        });

        // On most browsers this only fires when the click wasn't prevented.
        // On iOS WebKit it can fire even when preventDefault was called on the
        // click (because the browser toggles state before dispatching click).
        // Guard against that: if a PIN is set, ignore change events entirely —
        // the click handler's PIN flow is the only authorized path to update
        // state. We also re-sync the DOM to our source of truth.
        filterToggle.addEventListener('change', () => {
            if (getStoredPinHash()) {
                filterToggle.checked = state.filterRealWords;
                return;
            }
            state.filterRealWords = filterToggle.checked;
            saveFilterPref();
            sessions.clear();
            buildTest();
            render();
        });

        document.querySelectorAll('#mode-switch button').forEach(btn => {
            btn.addEventListener('click', () => setQuizMode(btn.dataset.mode));
        });

        // Spelling Test parent row collapses/expands its submenu.
        document.getElementById('spelling-parent').addEventListener('click', () => {
            const group = document.getElementById('spelling-group');
            const open = group.classList.toggle('open');
            document.getElementById('spelling-parent').setAttribute('aria-expanded', String(open));
        });

        // ---------- Init ----------
        loadWords();
        filterToggle.checked = state.filterRealWords;
        updatePinStatusBadge();
        renderSidebar();
        renderHeader();
        buildTest();
        render();
        loadRecordings();
        prefetchRecordings(activeWords());
        const activeItem = document.querySelector('.sub-item.active');
        if (activeItem) activeItem.scrollIntoView({ block: 'nearest' });
    </script>
</body>
</html>
